[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/identity",
    "crates/friends",
    "crates/houses",
    "crates/world",
    "crates/multiplayer",
    "crates/messaging",
    "crates/privacy",
    "crates/gateway",
]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "chrono", "uuid"] }
futures-util = "0.3"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
sha2 = "0.10"
subtle = "2.6"
base64 = "0.22"
thiserror = "1.0"
async-trait = "0.1"
dashmap = "6.1"
dotenvy = "0.15"
